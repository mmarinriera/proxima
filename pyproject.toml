[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.2,<0.13" ]

[project]
name = "proxima"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license-files = [ "LICENSE" ]
authors = [ { name = "Miquel Marin Riera", email = "miquel.marin.riera@gmail.com" } ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "dotenv>=0.9.9",
  "fastapi[standard]>=0.141.1",
  "hishel[httpx]>=1.3.1",
  "httpx>=0.28.1",
  "pydantic>=2.13.5",
  "rich>=15",
  "typer>=0.27.2",
]
scripts.proxima = "proxima.cli:proxima"

[tool.uv]
required-version = ">=0.12.0"
build-backend.module-name = "proxima"
build-backend.module-root = "src"

[tool.ruff]
target-version = "py313"
line-length = 120
fix-only = true
lint.select = [ "ALL" ]
lint.ignore = [ "COM812", "D203", "D212" ]
lint.isort.force-single-line = true

[tool.semantic_release]
allow_zero_version = true
version_variables = [ "src/proxima/__init__.py:VERSION" ]
version_toml = [ "pyproject.toml:project.version" ]
build_command = '''    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
'''
commit_message = "chore(release): version {version}"
publish.upload_to_vcs_release = false
branch = "main"
